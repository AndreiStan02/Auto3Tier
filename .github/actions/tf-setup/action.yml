name: Terraform Setup
description: Resolve region, configure AWS credentials, ensure the state bucket exists, and run terraform init.

inputs:
  aws-access-key-id:
    description: AWS access key ID
    required: true
  aws-secret-access-key:
    description: AWS secret access key
    required: true
  working-directory:
    description: Terraform root module directory
    required: false
    default: environment
  terraform-version:
    # Quoted, or YAML parses it as a float and 1.20 becomes 1.2.
    description: "Terraform version. Keep matched to your local one — older Terraform cannot read state written by a newer one."
    required: false
    default: "1.15.8"

runs:
  using: composite
  steps:
    # The state bucket must exist before Terraform parses tfvars, so the region
    # is read out here. Requires `aws_region = "..."` at the start of a line.
    - name: Resolve region
      shell: bash
      run: |
        set -euo pipefail
        tfvars="${{ inputs.working-directory }}/terraform.tfvars"
        region=$(sed -n 's/^[[:space:]]*aws_region[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' "$tfvars" | head -1)
        if [ -z "$region" ]; then
          echo "::error file=$tfvars::Could not read aws_region. Expected a line like: aws_region = \"eu-west-1\""
          exit 1
        fi
        echo "AWS_REGION=$region" >> "$GITHUB_ENV"
        echo "Region: $region"

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ inputs.aws-access-key-id }}
        aws-secret-access-key: ${{ inputs.aws-secret-access-key }}
        aws-region: ${{ env.AWS_REGION }}

    # Account ID makes the name unique without a random suffix, so every run
    # resolves to the same bucket.
    - name: Resolve state bucket name
      shell: bash
      run: |
        set -euo pipefail
        account_id=$(aws sts get-caller-identity --query Account --output text)
        echo "STATE_BUCKET=auto3tier-tfstate-${account_id}-${AWS_REGION}" >> "$GITHUB_ENV"

    # Create if missing, but always re-assert config so a half-failed first run
    # repairs itself next deploy.
    - name: Ensure state bucket
      shell: bash
      run: |
        set -euo pipefail

        if aws s3api head-bucket --bucket "$STATE_BUCKET" 2>/dev/null; then
          echo "State bucket already exists: $STATE_BUCKET"
        else
          echo "Creating state bucket: $STATE_BUCKET"
          # us-east-1 is the one region that rejects LocationConstraint.
          if [ "$AWS_REGION" = "us-east-1" ]; then
            aws s3api create-bucket --bucket "$STATE_BUCKET"
          else
            aws s3api create-bucket \
              --bucket "$STATE_BUCKET" \
              --create-bucket-configuration "LocationConstraint=$AWS_REGION"
          fi
          aws s3api wait bucket-exists --bucket "$STATE_BUCKET"
        fi

        # Escape hatch from a corrupted state write.
        aws s3api put-bucket-versioning \
          --bucket "$STATE_BUCKET" \
          --versioning-configuration Status=Enabled

        aws s3api put-public-access-block \
          --bucket "$STATE_BUCKET" \
          --public-access-block-configuration \
            BlockPublicAcls=true,IgnorePublicAcls=true,BlockPublicPolicy=true,RestrictPublicBuckets=true

        aws s3api put-bucket-encryption \
          --bucket "$STATE_BUCKET" \
          --server-side-encryption-configuration \
            '{"Rules":[{"ApplyServerSideEncryptionByDefault":{"SSEAlgorithm":"AES256"}}]}'

        # Old state versions accumulate forever otherwise.
        aws s3api put-bucket-lifecycle-configuration \
          --bucket "$STATE_BUCKET" \
          --lifecycle-configuration '{
            "Rules": [{
              "ID": "expire-noncurrent-state",
              "Status": "Enabled",
              "Filter": {"Prefix": ""},
              "NoncurrentVersionExpiration": {"NoncurrentDays": 90}
            }]
          }'

    # terraform_wrapper mangles stdout and breaks `terraform output -raw`.
    - name: Install Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: ${{ inputs.terraform-version }}
        terraform_wrapper: false

    # use_lockfile replaces the old DynamoDB lock table (Terraform >= 1.11).
    - name: Terraform init
      shell: bash
      run: |
        set -euo pipefail
        terraform -chdir="${{ inputs.working-directory }}" init \
          -input=false \
          -backend-config="bucket=$STATE_BUCKET" \
          -backend-config="key=auto3tier/terraform.tfstate" \
          -backend-config="region=$AWS_REGION" \
          -backend-config="use_lockfile=true"
